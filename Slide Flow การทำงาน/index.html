<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CostFlow - ผังขั้นตอนการทำงานระบบ (Interactive Process Flowchart)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF CDN for Direct PDF File Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"IBM Plex Sans Thai"', 'Poppins', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#2563eb',
                            dark: '#1d4ed8',
                            subtle: '#eff6ff',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base Canvas & SVG Diagram Animations */
        body {
            user-select: none;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(#cbd5e1 1.1px, transparent 1.1px),
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.03) 0px, transparent 50%);
            background-size: 24px 24px, 100% 100%, 100% 100%;
        }

        /* SVG Flowchart Presentation */
        .flowchart-svg {
            display: block;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .fit-mode .flowchart-svg {
            height: calc(100vh - 120px);
            width: auto;
            max-width: 95vw;
        }

        .zoom-mode {
            align-items: flex-start !important;
            padding-top: 24px !important;
            padding-bottom: 80px !important;
        }

        .zoom-mode .flowchart-svg {
            width: 820px;
            height: auto;
            max-width: none;
        }

        /* SVG Node & Arrow Transitions */
        .fc-node {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(4px);
        }

        .fc-node.revealed {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .fc-node.active-focus .fc-shape {
            stroke: #2563eb !important;
            stroke-width: 2.2px !important;
            filter: drop-shadow(0 4px 10px rgba(37, 99, 235, 0.2));
        }

        .fc-shape {
            fill: #ffffff;
            stroke: #94a3b8;
            stroke-width: 1.5px;
            transition: stroke 0.25s, stroke-width 0.25s, filter 0.25s;
        }

        .fc-text {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #1e293b;
        }

        .fc-text-title {
            font-weight: 700;
            font-size: 13px;
        }

        .fc-arrow {
            stroke: #94a3b8;
            stroke-width: 1.6px;
            fill: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .fc-arrow.revealed {
            opacity: 1;
            stroke: #475569;
        }

        .fc-arrow.active-flow {
            stroke: #2563eb !important;
            stroke-width: 2.2px !important;
        }

        .fc-edge-label {
            opacity: 0;
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #475569;
            transition: opacity 0.25s ease;
        }

        .fc-edge-label.revealed {
            opacity: 1;
        }

        /* Special Highlighting Nodes */
        .node-instock .fc-shape {
            stroke: #059669;
            fill: #f0fdf4;
        }
        .node-instock.active-focus .fc-shape {
            stroke: #047857 !important;
            filter: drop-shadow(0 4px 10px rgba(5, 150, 105, 0.25)) !important;
        }

        /* Print Optimization */
        @media print {
            header, footer, .click-hint, #detail-modal {
                display: none !important;
            }
            body {
                background: white !important;
                overflow: visible !important;
            }
            .fit-mode .flowchart-svg {
                height: 100% !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            .fc-node, .fc-arrow, .fc-edge-label {
                opacity: 1 !important;
                stroke-dashoffset: 0 !important;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800">

    <!-- Top Navigation Header -->
    <header class="h-14 border-b border-slate-200 bg-white/95 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-30 select-none shadow-xs">
        <!-- Left: Brand Logo & Title -->
        <div class="flex items-center gap-3 min-w-0">
            <div class="flex items-center gap-2 shrink-0 select-none">
                <img src="logo.png" onerror="this.src='../wwwroot/images/logo.png'" alt="CostFlow Logo" class="w-7 h-7 object-contain drop-shadow-2xs" />
                <span class="text-sm font-bold tracking-tight text-slate-900 hidden sm:inline">CostFlow</span>
            </div>
            <div class="h-4 w-px bg-slate-200 shrink-0"></div>
            <div class="truncate">
                <h1 id="header-title" class="text-xs sm:text-sm font-bold text-slate-800 leading-tight truncate">
                    ผังขั้นตอนการทำงานระบบของหน้างาน
                </h1>
            </div>
        </div>

        <!-- Right: Flow Switcher Tabs (Clean Segmented Control - No Nested Borders) -->
        <nav class="flex items-center p-1 bg-slate-100/90 rounded-lg shrink-0 gap-0.5" aria-label="สลับขั้นตอนการทำงาน">
            <button type="button" id="tab-type1" onclick="switchFlow('type1')"
                    class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all cursor-pointer bg-white text-blue-700 shadow-2xs"
                    title="สลับไปผังของหน้างาน (ของจุกจิก นำไปใช้ทันที)">
                <span class="hidden sm:inline">Type 1: </span>ของหน้างาน
            </button>
            <button type="button" id="tab-type2" onclick="switchFlow('type2')"
                    class="px-3 py-1.5 text-xs font-medium rounded-md transition-all cursor-pointer text-slate-600 hover:text-slate-900"
                    title="สลับไปผังของหัวหน้างาน (สั่งซื้อ, FileMerge, แผนสัปดาห์, Monthly Cost)">
                <span class="hidden sm:inline">Type 2: </span>ของหัวหน้างาน
            </button>
            <button type="button" id="tab-overall" onclick="switchFlow('overall')"
                    class="px-3 py-1.5 text-xs font-medium rounded-md transition-all cursor-pointer text-slate-600 hover:text-slate-900"
                    title="สลับไปผังรวมระบบเดิม (ERP, แผน KC, ตัดจ่าย)">
                ผังรวมระบบเดิม
            </button>
        </nav>
    </header>

    <!-- Canvas Workspace (Default: Zoom Mode ขยายเต็มตา) -->
    <main id="canvas-container" class="flex-1 relative overflow-auto flex justify-center items-center p-4 cursor-pointer zoom-mode" onclick="handleCanvasClick(event)">

        <div class="flowchart-wrapper flex justify-center items-center" id="flowchart-wrap">
            
            <!-- ========================================================= -->
            <!-- 1. SVG: TYPE 1 - ของหน้างาน (ViewBox: 0 0 820 850)        -->
            <!-- ========================================================= -->
            <svg id="svg-type1" class="flowchart-svg" viewBox="0 0 820 850" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="t1-arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                        <path d="M 2.5 2 L 7 5 L 2.5 8" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                    <marker id="t1-arrowhead-active" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                        <path d="M 2.5 2 L 7 5 L 2.5 8" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                </defs>

                <!-- START -->
                <g class="fc-node" id="t1-fn-start">
                    <rect class="fc-shape" x="330" y="25" width="160" height="46" rx="23" ry="23" />
                    <text class="fc-text fc-text-title" x="410" y="48">เริ่มต้น</text>
                </g>
                <path class="fc-arrow" id="t1-fa-0" d="M 410 71 L 410 110" marker-end="url(#t1-arrowhead)" />

                <!-- 1. INPUT (Parallelogram) -->
                <g class="fc-node" id="t1-fn-step1">
                    <polygon class="fc-shape" points="195,110 655,110 625,180 165,180" />
                    <text class="fc-text fc-text-title" x="410" y="135">1. รายการของที่ช่างหน้างานต้องการ</text>
                    <text class="fc-text" x="410" y="156" style="font-size: 12px; fill: #475569;">(น็อต, สกรู, เทป, กาว, ใบตัด, ดอกสว่าน ฯลฯ)</text>
                </g>
                <path class="fc-arrow" id="t1-fa-1" d="M 410 180 L 410 220" marker-end="url(#t1-arrowhead)" />

                <!-- 2. PROCESS (Rectangle) -->
                <g class="fc-node" id="t1-fn-step2">
                    <rect class="fc-shape" x="160" y="220" width="500" height="58" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="243">2. คีย์สั่งซื้อใน ProductSearch (ค้นหาในระบบ / กรอกเพิ่มในระบบ)</text>
                    <text class="fc-text" x="410" y="263" style="font-size: 11.5px; fill: #2563eb; font-weight: 600;">(ระบบส่งแจ้งเตือนการสั่งซื้อไปยังหน้าแรก/กระดิ่งทันที)</text>
                </g>
                <path class="fc-arrow" id="t1-fa-2" d="M 410 278 L 410 315" marker-end="url(#t1-arrowhead)" />

                <!-- 3. DECISION (Diamond) -->
                <g class="fc-node" id="t1-fn-dec">
                    <polygon class="fc-shape" points="410,315 540,380 410,445 280,380" />
                    <text class="fc-text fc-text-title" x="410" y="373">ตรวจสอบสถานะการจัดส่ง</text>
                    <text class="fc-text" x="410" y="393" style="font-size: 11.5px; fill: #475569;">ของส่งถึงหน้างานแล้วหรือยัง?</text>
                </g>

                <!-- NO: loop back with Wait Box -->
                <path class="fc-arrow" id="t1-fa-no-1" d="M 540 380 L 620 380" marker-end="url(#t1-arrowhead)" />
                <text class="fc-edge-label" id="t1-fl-no" x="580" y="370" style="fill: #dc2626; font-weight: 700;">ยังไม่มา</text>
                <g class="fc-node" id="t1-fn-wait">
                    <rect class="fc-shape" x="620" y="355" width="120" height="50" rx="4" />
                    <text class="fc-text fc-text-title" x="680" y="377">รอร้านค้าจัดส่ง</text>
                    <text class="fc-text" x="680" y="394" style="font-size: 10.5px; fill: #64748b;">(ติดตามสถานะสินค้า)</text>
                </g>
                <path class="fc-arrow" id="t1-fa-no-2" d="M 680 355 L 680 298 L 410 298" marker-end="url(#t1-arrowhead)" />

                <!-- YES -->
                <path class="fc-arrow" id="t1-fa-yes" d="M 410 445 L 410 490" marker-end="url(#t1-arrowhead)" />
                <text class="fc-edge-label" id="t1-fl-yes" x="440" y="468" style="fill: #059669; font-weight: 700;">มาแล้ว</text>

                <!-- 3. PROCESS (Rectangle) -->
                <g class="fc-node" id="t1-fn-step3">
                    <rect class="fc-shape" x="160" y="490" width="500" height="58" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="514">ของมาถึง &rarr; กดรับในระบบ OrderTracking</text>
                    <text class="fc-text" x="410" y="534" style="font-size: 11.5px; fill: #475569;">อัปเดตสถานะรับของที่หน้า OrderTracking & ช่างนำไปใช้ทันที</text>
                </g>
                <path class="fc-arrow" id="t1-fa-3" d="M 410 548 L 410 590" marker-end="url(#t1-arrowhead)" />

                <!-- 4. PROCESS (Rectangle) -->
                <g class="fc-node" id="t1-fn-step4">
                    <rect class="fc-shape" x="180" y="590" width="460" height="50" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="612">4. ระบบบันทึกประวัติรายการใน SavedOrders</text>
                    <text class="fc-text" x="410" y="629" style="font-size: 11.5px; fill: #475569;">(ดูประวัติคำสั่งซื้อ ยอดสั่งซื้อ และสถานะย้อนหลังได้)</text>
                </g>
                <path class="fc-arrow" id="t1-fa-4" d="M 410 640 L 410 680" marker-end="url(#t1-arrowhead)" />

                <!-- 5. OUTPUT (Parallelogram) -->
                <g class="fc-node" id="t1-fn-step5">
                    <polygon class="fc-shape" points="205,680 645,680 615,730 175,730" />
                    <text class="fc-text fc-text-title" x="410" y="708">5. ระบบส่งเตือนไปหน้าแรกว่ารับของแล้ว</text>
                </g>
                <path class="fc-arrow" id="t1-fa-5" d="M 410 730 L 410 770" marker-end="url(#t1-arrowhead)" />

                <!-- END -->
                <g class="fc-node" id="t1-fn-end">
                    <rect class="fc-shape" x="330" y="770" width="160" height="46" rx="23" ry="23" />
                    <text class="fc-text fc-text-title" x="410" y="793">สิ้นสุด</text>
                </g>
            </svg>

            <!-- ========================================================= -->
            <!-- 2. SVG: TYPE 2 - ของหัวหน้างาน (ViewBox: 0 0 820 1790)    -->
            <!-- ========================================================= -->
            <svg id="svg-type2" class="flowchart-svg hidden" viewBox="0 0 820 1790" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="t2-arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                        <path d="M 2.5 2 L 7 5 L 2.5 8" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                    <marker id="t2-arrowhead-active" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                        <path d="M 2.5 2 L 7 5 L 2.5 8" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                    </marker>
                </defs>

                <!-- START -->
                <g class="fc-node" id="t2-fn-start">
                    <rect class="fc-shape" x="330" y="25" width="160" height="44" rx="22" ry="22" />
                    <text class="fc-text fc-text-title" x="410" y="47">เริ่มต้น</text>
                </g>
                <path class="fc-arrow" id="t2-fa-0" d="M 410 69 L 410 105" marker-end="url(#t2-arrowhead)" />

                <!-- 1. INPUT (Parallelogram) -->
                <g class="fc-node" id="t2-fn-step1">
                    <polygon class="fc-shape" points="160,105 690,105 660,165 130,165" />
                    <text class="fc-text fc-text-title" x="410" y="125">1. หัวหน้างานเตรียมรายการสั่งซื้อ</text>
                    <text class="fc-text" x="410" y="145" style="font-size: 11.5px; fill: #475569;">(หัวหน้างานรู้รายการอะไหล่/ชิ้นส่วนที่ต้องสั่งล่วงหน้าอยู่แล้ว)</text>
                </g>
                <path class="fc-arrow" id="t2-fa-1" d="M 410 165 L 410 195" marker-end="url(#t2-arrowhead)" />

                <!-- 2. PROCESS (Rectangle) -->
                <g class="fc-node" id="t2-fn-step2">
                    <rect class="fc-shape" x="170" y="195" width="480" height="58" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="215">2. คีย์ใบสั่งซื้อในระบบ &amp; ส่งออกไฟล์ Excel</text>
                    <text class="fc-text" x="410" y="235" style="font-size: 11.5px; fill: #475569;">(เปิดคำสั่งซื้อ WO ในระบบ และ Export ออกมาเป็นไฟล์ Excel)</text>
                </g>
                <path class="fc-arrow" id="t2-fa-2" d="M 410 253 L 410 285" marker-end="url(#t2-arrowhead)" />

                <!-- 3. PROCESS (Rectangle) -->
                <g class="fc-node" id="t2-fn-step3">
                    <rect class="fc-shape" x="170" y="285" width="480" height="58" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="305">3. นำไฟล์ Excel เข้าหน้า FileMerge (/FileMerge)</text>
                    <text class="fc-text" x="410" y="325" style="font-size: 11.5px; fill: #475569;">(นำไฟล์เข้าสู่ระบบเพื่อตรวจสอบข้อมูลคำสั่งซื้อ)</text>
                </g>
                <path class="fc-arrow" id="t2-fa-3" d="M 410 343 L 410 375" marker-end="url(#t2-arrowhead)" />

                <!-- DECISION 1: แผนสัปดาห์ KC (Diamond) -->
                <g class="fc-node" id="t2-fn-dec-kc">
                    <polygon class="fc-shape" points="410,375 560,420 410,465 260,420" />
                    <text class="fc-text fc-text-title" x="410" y="413">เทียบ WO กับแผนผลิตประจำสัปดาห์ (KC)</text>
                    <text class="fc-text" x="410" y="430" style="font-size: 11px; fill: #475569;">(ดูว่า WO ไหนตรงกันเพื่อดูเป้าหมายส่งมอบ)</text>
                </g>

                <!-- Branch 1A: มีแผนสัปดาห์ (Yes / ซ้าย) -->
                <path class="fc-arrow" id="t2-fa-kc-yes" d="M 260 420 L 190 420 L 190 480" marker-end="url(#t2-arrowhead)" />
                <text class="fc-edge-label" id="t2-fl-kc-yes" x="225" y="410">มี (อัปเดต)</text>

                <g class="fc-node" id="t2-fn-report">
                    <rect class="fc-shape" x="80" y="480" width="220" height="54" rx="4" />
                    <text class="fc-text fc-text-title" x="190" y="499">หน้ารายงาน (Report)</text>
                    <text class="fc-text" x="190" y="518" style="font-size: 11px; fill: #475569;">อัปเดตแผนเช็ก WO ตรงกัน</text>
                </g>
                <path class="fc-arrow" id="t2-fa-kc-merge" data-no-arrow="true" d="M 190 534 L 190 560 L 410 560" />

                <!-- Branch 1B: ไม่มี (No / ขวา - ข้ามได้) -->
                <path class="fc-arrow" id="t2-fa-kc-no" data-no-arrow="true" d="M 560 420 L 630 420 L 630 560 L 410 560" />
                <text class="fc-edge-label" id="t2-fl-kc-no" x="595" y="410">ไม่มี (ข้ามได้)</text>

                <!-- Arrow down to Step 4 -->
                <path class="fc-arrow" id="t2-fa-to-mc" d="M 410 560 L 410 585" marker-end="url(#t2-arrowhead)" />

                <!-- 4. PROCESS: MonthlyCost (Rectangle) -->
                <g class="fc-node" id="t2-fn-step4">
                    <rect class="fc-shape" x="160" y="585" width="500" height="58" rx="4" />
                    <text class="fc-text fc-text-title" x="410" y="605">4. ติดตามสถานะประจำเดือนที่ Monthly Cost</text>
                    <text class="fc-text" x="410" y="625" style="font-size: 11.5px; fill: #475569;">(เดือนที่ต้องการทำรายการ)</text>
                </g>
                <path class="fc-arrow" id="t2-fa-to-dec-rcv" d="M 410 643 L 410 675" marker-end="url(#t2-arrowhead)" />

                <!-- DECISION 2: ตรวจรับสินค้าช่วงสิ้นเดือน (Diamond) -->
                <!-- DECISION 2: ตรวจรับสินค้าช่วงสิ้นเดือน (Diamond) -->
                <g class="fc-node" id="t2-fn-dec-rcv">
                    <polygon class="fc-shape" points="410,675 570,720 410,765 250,720" />
                    <text class="fc-text fc-text-title" x="410" y="713">สถานะการรับสินค้าช่วงสิ้นเดือน?</text>
                    <text class="fc-text" x="410" y="730" style="font-size: 11px; fill: #475569;">(ตรวจนับของ &amp; จัดการตัดจ่ายงวดเดือน)</text>
                </g>

                <!-- Branch 2A (ซ้าย): ได้รับสินค้าแล้ว -->
                <path class="fc-arrow" id="t2-fa-rcv-yes" d="M 250 720 L 150 720 L 150 775" marker-end="url(#t2-arrowhead)" />
                <text class="fc-edge-label" id="t2-fl-rcv-yes" x="195" y="710">รับสินค้าแล้ว</text>

                <!-- Box 2A-1: รับแล้ว จ่ายเลย -->
                <g class="fc-node node-instock" id="t2-fn-opt-paid">
                    <rect class="fc-shape" x="35" y="775" width="230" height="56" rx="4" />
                    <text class="fc-text fc-text-title" x="150" y="794" style="fill: #065f46;">1. รับแล้ว จ่ายเลย</text>

        // Current Application State
        let currentFlowKey = 'type1';
        let currentStep = 0;
        let isZoomMode = true;
        let autoPlayTimer = null;
        const LINE_DRAW_DURATION = 650;

        // Switch Active Flow Function
        function switchFlow(flowKey) {
            if (!FLOW_CONFIG[flowKey]) return;
            if (autoPlayTimer) toggleAutoPlay();

            currentFlowKey = flowKey;
            const config = FLOW_CONFIG[flowKey];

            // 1. Update Tabs Visual (Clean Segmented Control - Single Boundary Layer)
            ['type1', 'type2', 'overall'].forEach(k => {
                const tab = document.getElementById(`tab-${k}`);
                if (!tab) return;
                if (k === flowKey) {
                    tab.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all cursor-pointer bg-white text-blue-700 shadow-2xs";
                } else {
                    tab.className = "px-3 py-1.5 text-xs font-medium rounded-md transition-all cursor-pointer text-slate-600 hover:text-slate-900";
                }
            });

            // 2. Update Header Info
            const badgeEl = document.getElementById('header-badge');
            const titleEl = document.getElementById('header-title');
            const subtitleEl = document.getElementById('header-subtitle');
            if (badgeEl) badgeEl.textContent = config.badge.split(':')[0];
            if (titleEl) titleEl.textContent = config.title;
            if (subtitleEl) subtitleEl.textContent = config.subtitle;

            // 3. Switch SVG Diagram
            ['svg-type1', 'svg-type2', 'svg-overall'].forEach(id => {
                const svg = document.getElementById(id);
                if (!svg) return;
                svg.classList.toggle('hidden', id !== config.svgId);
            });

            // 4. Reset Stepper State & Arrows

            // 5. Update Modal Content
            const modalTitle = document.getElementById('modal-title');
            const modalSubtitle = document.getElementById('modal-subtitle');
            const modalTable = document.getElementById('modal-table-container');
            if (modalTitle) modalTitle.textContent = config.modalTitle;
            if (modalSubtitle) modalSubtitle.textContent = config.modalSubtitle;
            if (modalTable) modalTable.innerHTML = config.tableHtml;

            // 6. Reset Stepper State & Arrows
            initArrowPathsForActiveSvg();
            currentStep = 0;
            applyStepState(0, false);
        }

        // Render Bottom Dots Indicator
        function renderDots(config) {
            const container = document.getElementById('dots-container');
            if (!container) return;
            container.innerHTML = config.dots.map((dot, idx) => `
                <div class="dot h-2 rounded-full transition-all cursor-pointer ${idx === 0 ? 'w-5 bg-blue-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}"
                     onclick="goToDot(${idx})" title="${dot.title}"></div>
            `).join('');
        }

        // Initialize Arrow Paths with stroke-dasharray for Active SVG
        function initArrowPathsForActiveSvg() {
            const config = FLOW_CONFIG[currentFlowKey];
            const activeSvg = document.getElementById(config.svgId);
            if (!activeSvg) return;

            const arrows = activeSvg.querySelectorAll('.fc-arrow');
            arrows.forEach(arrow => {
                const len = Math.ceil(arrow.getTotalLength() || 100);
                arrow.dataset.length = len;
                arrow.style.strokeDasharray = `${len} ${len}`;
                arrow.style.strokeDashoffset = `${len}`;
            });
        }

        // Animate Arrow Draw
        function animateArrowDraw(arrowId, duration = LINE_DRAW_DURATION) {
            const el = document.getElementById(arrowId);
            if (!el) return;
            const len = parseFloat(el.dataset.length) || Math.ceil(el.getTotalLength() || 100);
            const activeMarker = FLOW_CONFIG[currentFlowKey].arrowheadActiveMarker;

            el.classList.add('revealed', 'active-flow');
            if (el.dataset.noArrow === 'true') {
                el.removeAttribute('marker-end');
            } else {
                el.setAttribute('marker-end', `url(#${activeMarker})`);
            }
            el.style.strokeDasharray = `${len} ${len}`;
            el.style.strokeDashoffset = `${len}`;
            el.getBoundingClientRect(); // trigger reflow
            el.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease`;
            el.style.opacity = '1';
            el.style.strokeDashoffset = '0';
        }

        function showArrowInstant(arrowId) {
            const el = document.getElementById(arrowId);
            if (!el) return;
            const normalMarker = FLOW_CONFIG[currentFlowKey].arrowheadMarker;
            el.classList.add('revealed');
            el.classList.remove('active-flow');
            if (el.dataset.noArrow === 'true') {
                el.removeAttribute('marker-end');
            } else {
                el.setAttribute('marker-end', `url(#${normalMarker})`);
            }
            el.style.transition = 'none';
            el.style.opacity = '1';
            el.style.strokeDashoffset = '0';
        }

        function hideArrow(arrowId) {
            const el = document.getElementById(arrowId);
            if (!el) return;
            const len = parseFloat(el.dataset.length) || Math.ceil(el.getTotalLength() || 100);
            const normalMarker = FLOW_CONFIG[currentFlowKey].arrowheadMarker;
            el.classList.remove('revealed', 'active-flow');
            if (el.dataset.noArrow === 'true') {
                el.removeAttribute('marker-end');
            } else {
                el.setAttribute('marker-end', `url(#${normalMarker})`);
            }
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.strokeDashoffset = `${len}`;
        }

        function showNode(nodeId, isFocused = true) {
            const el = document.getElementById(nodeId);
            if (!el) return;
            el.classList.add('revealed');
            if (isFocused) {
                el.classList.add('active-focus');
            } else {
                el.classList.remove('active-focus');
            }
        }

        function hideNode(nodeId) {
            const el = document.getElementById(nodeId);
            if (!el) return;
            el.classList.remove('revealed', 'active-focus');
        }

        function showLabel(labelId) {
            const el = document.getElementById(labelId);
            if (el) el.classList.add('revealed');
        }

        function hideLabel(labelId) {
            const el = document.getElementById(labelId);
            if (el) el.classList.remove('revealed');
        }

        // Apply Step State for Active Flow
        function applyStepState(targetStep, isForward = true) {
            const config = FLOW_CONFIG[currentFlowKey];
            const activeSvg = document.getElementById(config.svgId);
            if (!activeSvg) return;

            const storyboard = config.storyboard;
            const normalMarker = config.arrowheadMarker;

            // Remove previous active focus/flow highlights
            activeSvg.querySelectorAll('.fc-node').forEach(n => n.classList.remove('active-focus'));
            activeSvg.querySelectorAll('.fc-arrow').forEach(a => {
                a.classList.remove('active-flow');
                if (a.dataset.noArrow === 'true') {
                    a.removeAttribute('marker-end');
                } else {
                    a.setAttribute('marker-end', `url(#${normalMarker})`);
                }
            });

            // 1. Reveal up to targetStep
            for (let i = 0; i <= targetStep; i++) {
                const act = storyboard[i];
                const isCurrent = (i === targetStep);

                if (act.nodes) {
                    act.nodes.forEach(id => {
                        showNode(id, isCurrent && isForward);
                    });
                }
                if (act.arrows) {
                    act.arrows.forEach(id => {
                        if (isCurrent && isForward) {
                            animateArrowDraw(id);
                        } else {
                            showArrowInstant(id);
                        }
                    });
                }
                if (act.labels) {
                    act.labels.forEach(id => showLabel(id));
                }
            }

            // 2. Hide after targetStep
            for (let i = targetStep + 1; i < storyboard.length; i++) {
                const act = storyboard[i];
                if (act.nodes) act.nodes.forEach(id => hideNode(id));
                if (act.arrows) act.arrows.forEach(id => hideArrow(id));
                if (act.labels) act.labels.forEach(id => hideLabel(id));
            }

            // 3. Update Navigation Buttons
            const prevBtn = document.getElementById('prev-btn');
            if (prevBtn) prevBtn.disabled = (targetStep === 0);

            const nextBtnText = document.getElementById('next-btn-text');
            const nextBtnIcon = document.getElementById('next-btn-icon');
            if (targetStep === storyboard.length - 1) {
                if (nextBtnText) nextBtnText.textContent = "เริ่มต้นใหม่";
                if (nextBtnIcon) nextBtnIcon.innerHTML = '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>';
            } else {
                if (nextBtnText) nextBtnText.textContent = "ขั้นตอนถัดไป";
                if (nextBtnIcon) nextBtnIcon.innerHTML = '<path d="m9 18 6-6-6-6"/>';
            }

            // 5. Smooth Scroll in Zoom Mode
            if (isZoomMode) {
                const curAct = storyboard[targetStep];
                let focusTarget = null;
                if (curAct.nodes && curAct.nodes.length > 0) {
                    focusTarget = document.getElementById(curAct.nodes[0]);
                } else if (curAct.arrows && curAct.arrows.length > 0) {
                    focusTarget = document.getElementById(curAct.arrows[0]);
                }
                if (focusTarget) {
                    setTimeout(() => {
                        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 60);
                }
            }
        }

        // Stepper Navigation Handlers
        function nextAction() {
            const config = FLOW_CONFIG[currentFlowKey];
            if (currentStep < config.storyboard.length - 1) {
                currentStep++;
                applyStepState(currentStep, true);
            } else {
                currentStep = 0;
                applyStepState(0, false);
            }
        }

        function prevAction() {
            if (currentStep > 0) {
                currentStep--;
                applyStepState(currentStep, false);
            }
        }

        function goToDot(catIndex) {
            const config = FLOW_CONFIG[currentFlowKey];
            if (catIndex >= 0 && catIndex < config.dotCategoryStarts.length) {
                currentStep = config.dotCategoryStarts[catIndex];
                applyStepState(currentStep, false);
            }
        }

        function handleCanvasClick(e) {
            if (e.target.closest('footer') || e.target.closest('header') || e.target.closest('button') || e.target.closest('#detail-modal')) {
                return;
            }
            nextAction();
        }

        // Toggle Fit vs Zoom Mode
        function toggleViewMode() {
            isZoomMode = !isZoomMode;
            const container = document.getElementById('canvas-container');
            const modeText = document.getElementById('view-mode-text');
            const modeIcon = document.getElementById('view-mode-icon');

            if (isZoomMode) {
                container.classList.remove('fit-mode');
                container.classList.add('zoom-mode');
                if (modeText) modeText.textContent = "พอดีหน้าจอ";
                if (modeIcon) modeIcon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
            } else {
                container.classList.remove('zoom-mode');
                container.classList.add('fit-mode');
                if (modeText) modeText.textContent = "ขยายเต็มตา";
                if (modeIcon) modeIcon.innerHTML = '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>';
                container.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Auto Play
        function toggleAutoPlay() {
            const autoBtn = document.getElementById('auto-btn');
            const autoText = document.getElementById('auto-text');
            const autoIcon = document.getElementById('auto-icon');
            const config = FLOW_CONFIG[currentFlowKey];

            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                if (autoText) autoText.textContent = "เล่นอัตโนมัติ";
                if (autoBtn) {
                    autoBtn.className = "inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 shadow-2xs transition-colors cursor-pointer";
                }
                if (autoIcon) autoIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
            } else {
                if (autoText) autoText.textContent = "หยุดชั่วคราว";
                if (autoBtn) {
                    autoBtn.className = "inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition-colors cursor-pointer";
                }
                if (autoIcon) autoIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

                if (currentStep === config.storyboard.length - 1) {
                    currentStep = 0;
                    applyStepState(0, false);
                }

                autoPlayTimer = setInterval(() => {
                    if (currentStep < config.storyboard.length - 1) {
                        nextAction();
                    } else {
                        toggleAutoPlay();
                    }
                }, 1450);
            }
        }

        // Modal Handlers
        function openDetailModal() {
            const modal = document.getElementById('detail-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeDetailModal(e) {
            if (e && e.target && e.target.closest('#detail-modal > div') && !e.target.closest('button')) {
                return;
            }
            const modal = document.getElementById('detail-modal');
            if (modal) modal.classList.add('hidden');
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetailModal();
                return;
            }
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextAction();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevAction();
            }
        });

        // Direct PDF Export (Pure Flowchart Download, No Print Dialog)
        async function ensureJsPdfLoaded() {
            if (window.jspdf && window.jspdf.jsPDF) return true;
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                s.onload = () => resolve(true);
                s.onerror = () => resolve(false);
                document.head.appendChild(s);
            });
        }

        async function exportFlowchartPdf() {
            const btn = document.getElementById('export-pdf-btn');
            const originalHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `
                    <svg class="animate-spin w-3.5 h-3.5 text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                    <span>กำลังส่งออก PDF...</span>
                `;
            }

            try {
                await ensureJsPdfLoaded();
                if (document.fonts) await document.fonts.ready;

                const config = FLOW_CONFIG[currentFlowKey];
                const svgEl = document.getElementById(config.svgId);
                if (!svgEl) throw new Error('ไม่พบผังงาน');

                // 1. Clone SVG & reveal all elements for clean export
                const clone = svgEl.cloneNode(true);
                clone.classList.remove('hidden');

                clone.querySelectorAll('.fc-node').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                    el.classList.add('revealed');
                });
                clone.querySelectorAll('.fc-arrow').forEach(el => {
                    el.style.opacity = '1';
                    el.style.strokeDashoffset = '0';
                    el.classList.add('revealed');
                    if (el.dataset.noArrow === 'true') {
                        el.removeAttribute('marker-end');
                    }
                });
                clone.querySelectorAll('.fc-edge-label').forEach(el => {
                    el.style.opacity = '1';
                    el.classList.add('revealed');
                });

                // Get dimensions
                const vb = svgEl.viewBox.baseVal;
                const vbWidth = vb.width || 820;
                const vbHeight = vb.height || 1000;

                // 2. Inject internal style into clone to ensure styles persist during canvas draw
                const defs = clone.querySelector('defs') || clone.insertBefore(document.createElementNS('http://www.w3.org/2000/svg', 'defs'), clone.firstChild);
                const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
                styleEl.textContent = `
                    .fc-node { opacity: 1 !important; transform: none !important; }
                    .fc-shape { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5px; }
                    .fc-text { font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; text-anchor: middle; dominant-baseline: middle; fill: #1e293b; }
                    .fc-text-title { font-weight: 700; font-size: 13px; }
                    .fc-arrow { stroke: #475569; stroke-width: 1.6px; fill: none; opacity: 1 !important; stroke-dashoffset: 0 !important; }
                    .fc-edge-label { opacity: 1 !important; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; fill: #475569; }
                    .node-instock .fc-shape { stroke: #059669; fill: #f0fdf4; }
                `;
                defs.appendChild(styleEl);
                clone.setAttribute('width', vbWidth);
                clone.setAttribute('height', vbHeight);

                // 3. Serialize and render onto High-Resolution Canvas (2x scale for 300 DPI)
                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(clone);
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const img = new Image();
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('ไม่สามารถแปลงผังงานเป็นรูปภาพได้'));
                    img.src = url;
                });

                const scale = 2;
                const canvas = document.createElement('canvas');
                canvas.width = vbWidth * scale;
                canvas.height = vbHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);

                const imgData = canvas.toDataURL('image/png', 1.0);

                // 4. Orientation Decision:
                // Type 1 (สเต็ปน้อย): แนวตั้ง (portrait)
                // Type 2 / Overall (เนื้อหาเยอะ สเต็ปยาว): แนวนอน (landscape)
                const isLargeFlow = (currentFlowKey !== 'type1');
                const orientation = isLargeFlow ? 'landscape' : 'portrait';

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: orientation,
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const margin = 10;
                const printableW = pageWidth - (margin * 2);
                const printableH = pageHeight - (margin * 2);

                const imgAspect = vbWidth / vbHeight;
                const pageAspect = printableW / printableH;

                let renderW, renderH;
                if (imgAspect > pageAspect) {
                    renderW = printableW;
                    renderH = printableW / imgAspect;
                } else {
                    renderH = printableH;
                    renderW = printableH * imgAspect;
                }

                const posX = (pageWidth - renderW) / 2;
                const posY = (pageHeight - renderH) / 2;

                doc.addImage(imgData, 'PNG', posX, posY, renderW, renderH, undefined, 'FAST');

                // 5. Trigger Immediate File Download
                const flowNameClean = (currentFlowKey === 'type1' ? 'ของหน้างาน' : currentFlowKey === 'type2' ? 'ของหัวหน้างาน' : 'ผังรวมระบบเดิม');
                doc.save(`CostFlow_ผังขั้นตอน_${flowNameClean}.pdf`);
            } catch (err) {
                console.error('Export PDF error:', err);
                alert('ไม่สามารถส่งออก PDF ได้: ' + err.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            }
        }

        // Initialize App on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            switchFlow('type1');
        });
    </script>
